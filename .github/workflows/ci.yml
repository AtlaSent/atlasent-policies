name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public-safety check (self-test, then scan)
        run: |
          scripts/check-public-safety.sh --self-test
          scripts/check-public-safety.sh
      - name: DCO sign-off
        if: github.event_name == 'pull_request'
        run: scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      # Validate + test every policy through the AtlaSent rule engine.
      # Disabled until @atlasent/cli is published to npm (the action installs
      # it from there). To enable: delete the `if: false` line below.
      - name: Validate and test every policy (offline)
        if: false
        uses: ./actions/policy
        with:
          mode: check
